<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Motion Piano — Cloudflare Turnstile 인증 진단</title>
<style>
 body{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;margin:0;background:#f4f7fb;color:#172943;padding:24px}
 main{max-width:690px;margin:auto;background:#fff;border:1px solid #d1deeb;border-radius:16px;padding:24px;box-shadow:0 8px 30px #162f5015}
 h1{font-size:22px} p,li{line-height:1.65} button{border:1px solid #385780;background:#e9f3ff;border-radius:9px;padding:11px 14px;margin:3px;cursor:pointer;font-weight:700}
 #widget{min-height:80px;margin:22px 0;border:1px dashed #9bafc5;padding:10px;display:flex;align-items:center;justify-content:center}
 #status{padding:14px;background:#eef4ff;border-radius:10px;font-weight:750}
 #logs{padding:14px;background:#10253d;color:#d7f4eb;min-height:100px;max-height:290px;overflow:auto;white-space:pre-wrap;border-radius:12px;font:12px/1.7 ui-monospace,Consolas,monospace}
 small{color:#63718b} .warning{color:#af4b3e;font-weight:750}
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
</head>
<body><main>
<h1>AI Motion Piano · Turnstile 진단</h1>
<p>이 파일은 <b>인증 화면만 검사</b>합니다. 피아노 녹음과 Cloudflare Worker 업로드는 실행하지 않습니다.</p>
<p><b>현재 호스트:</b> <code id="hostname"></code></p>
<div><button id="real">① 실제 Site Key 검사</button><button id="dummy">② 공식 테스트 Site Key 검사</button><button id="retry">현재 위젯 다시 시도</button></div>
<div id="widget" aria-label="Turnstile 위젯"></div>
<div id="status" role="status">스크립트 로딩 확인 중…</div>
<h2>진단 기록</h2><pre id="logs"></pre>
<p class="warning">주의: 공식 테스트 키가 성공해도 실제 서버에 녹음을 업로드할 수 있는 것은 아닙니다. 운영용 index.html의 Site Key를 테스트 키로 바꾸지 마세요.</p>
<small>브라우저 개발자 도구 Console에서 오류 메시지를 함께 확인해 주세요. 이 페이지는 인증 토큰 내용을 화면이나 로그에 출력하지 않습니다.</small>
</main>
<script>
const REAL_SITE_KEY = '0x4AAAAAAFknUU0LCQCT8upc';
const DUMMY_SITE_KEY = '1x00000000000000000000AA';
let widgetId = null;
let mode = 'real';
const $ = id => document.getElementById(id);
function log(message){ $('logs').textContent += new Date().toLocaleTimeString('ko-KR') + ' | ' + message + '\n'; }
function status(message){ $('status').textContent=message; log(message); }
function render(modeToUse){
  mode = modeToUse;
  if(!window.turnstile || typeof window.turnstile.render !== 'function'){
    status('실패: Cloudflare Turnstile API가 로딩되지 않았습니다. Network/Console 확인'); return;
  }
  try {
    if(widgetId !== null){try{window.turnstile.remove(widgetId);}catch(err){log('기존 위젯 정리: '+String(err));}}
    widgetId = null;
    $('widget').replaceChildren();
    status((mode==='real'?'실제 Site Key':'공식 테스트 Site Key')+' 위젯 생성 요청');
    widgetId=window.turnstile.render('#widget',{
      sitekey: mode==='real'?REAL_SITE_KEY:DUMMY_SITE_KEY,
      theme:'light', appearance:'always',
      callback:()=>status('성공: 인증 토큰 발급 (토큰 값은 표시하지 않음)'),
      'error-callback': code => {status('오류: Turnstile error-callback 코드 '+code); console.error('Turnstile error code:',code); return true;},
      'expired-callback':()=>status('인증 만료: 다시 시도 버튼을 누르세요.'),
      'timeout-callback':()=>status('인증 시간 초과: 다시 시도 버튼을 누르세요.'),
      'unsupported-callback':()=>status('지원되지 않는 브라우저로 판정되었습니다.')
    });
    log('위젯 생성됨: '+String(widgetId));
  } catch(error){status('예외 발생: '+(error?.message||String(error))); console.error(error);}
}
$('hostname').textContent=location.hostname||'(호스트 없음)';
$('real').onclick=()=>render('real');
$('dummy').onclick=()=>render('dummy');
$('retry').onclick=()=>render(mode);
window.addEventListener('load',()=>{
  log('페이지 URL: '+location.href);
  log('Turnstile 스크립트: '+typeof window.turnstile);
  render('real');
});
</script></body></html>
